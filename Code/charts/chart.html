<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wykresy</title>
    <style>
        canvas {
            width: 85vw;
            height: 80vh;
            border: rgb(150, 80, 255) 2px solid;
            box-shadow: 0px 0px 25px rgb(117, 79, 255);
            background-color: rgb(234, 234, 234);
            border-radius: 5px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        h1 {
            align-items: center;
            font-family: Kepler;
            color: white;
            position: absolute;
            left: 45%;
            top: -2%;
            font-size: 3rem;
            transform: translate(-50%);
        }

        button {
            align-items: center;
            font-family: Kepler;
            font-weight: bold;
            color: white;
            background-color: black;
            border: rgb(150, 80, 255) 2px solid;
            border-radius: 5px;
            position: absolute;
            right: 70px;
            top: 25px;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>

<body style="background-color: #222222">
    <h1>Wykresy</h1>    
    <button>Zrób wykres</button>
    <textarea rows="4" cols="25" placeholder="<X1>,<Y1>;<X2>,<Y2>;...">1,1;2,76;3,81;4,79;5,78;6,83;7,79;8,82;9,78;10,81</textarea><!--ex totalen-->
    <div style="width: 80%;">
        <canvas></canvas>
    </div>
</body>

<script src="../e.js"></script>
<!--e.js is the same as misc.js in the other repo for anyone wondering-->
<script src="wykresy.js"></script>


</html>
